CONFIG_NEWLIB_LIBC=y #needed for bmp581 library
CONFIG_MULTITHREADING=y

#CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=y

CONFIG_PINCTRL=y

CONFIG_SENSOR=y

#CONFIG_HAS_STLIB=y
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_SPI_NOR_SFDP_RUNTIME=y

CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y

#BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

CONFIG_BT_DEVICE_NAME="phyfob"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=40
CONFIG_BT_CTLR_TX_PWR_PLUS_4=n

#reduce footprint
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BOOT_BANNER=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_THREAD_CUSTOM_DATA=n
CONFIG_THREAD_STACK_INFO=n

CONFIG_SPI_NRFX=y
CONFIG_SPI_NOR=y
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_SPI_NOR_SFDP_DEVICETREE=n
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
###################

CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_NANO=n

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# BMV080 datasheet: the library itself requires ~10 kB of stack and ~17 kB
# of RAM (confirmed dynamically allocated, not static - lib_bmv080.a's own
# .data/.bss sections are all 0 bytes) for whichever thread calls into it.
# We poll it from the main thread, so main's stack must cover that plus our
# own usage on top.
CONFIG_MAIN_STACK_SIZE=11264

# NOTE: no CONFIG_HEAP_MEM_POOL_SIZE needed here. Checked lib_bmv080.a and
# lib_postProcessor.a with nm -u: neither references malloc/calloc/free/
# realloc at all. The datasheet's "~17 kB RAM" figure is the library's
# static .bss (bmv080_ml_device.c.o + postProcessor.c.o + bmv080_rl.c.o
# add up to ~16.3 kB there) - it's not a heap requirement.

#CONFIG_POWEROFF=y
CONFIG_HW_STACK_PROTECTION=y
#low power

CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_PRINTK=n
CONFIG_SERIAL=n


###
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_FLASH=y
CONFIG_SPI=y
#CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
#CONFIG_FLASH_SPI_NOR=y
CONFIG_BOARD_ENABLE_DCDC=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=n


#FOTA#############
# Disabled: BMV080 alone needs ~16 kB static + ~17 kB heap + ~10 kB stack
# (~43 kB of the nRF52832's 64 kB RAM). MCUMGR/img-manager/BT-SMP-transport
# cost ~13 kB of RAM on top of that (net_buf pools, group handlers) - there
# is no room left for BLE-based FOTA while BMV080 is compiled in.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=n
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=n

CONFIG_STREAM_FLASH=y

CONFIG_IMG_MANAGER=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=n

CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
#FOTANEW

# Ensure an MCUboot-compatible binary is generated.
CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_FLASH_MAP=y

CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0

# Allow for large Bluetooth data packets.
CONFIG_BT_L2CAP_TX_MTU=27

CONFIG_BT_L2CAP_TX_BUF_COUNT=2

CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

CONFIG_BT_BUF_ACL_RX_SIZE=27

CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_BUF_ACL_TX_COUNT=2

CONFIG_BT_CTLR_RX_BUFFERS=2

CONFIG_BT_CONN_TX_MAX=2

CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27

CONFIG_BT_ATT_PREPARE_COUNT=2

# Enable the Bluetooth (unauthenticated) and shell mcumgr transports.
CONFIG_BT=y

#CONFIG_ISR_STACK_SIZE=1024
CONFIG_MPSL_WORK_STACK_SIZE=512

CONFIG_BT_LL_SW_SPLIT=n

#CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_ADC=n
CONFIG_ADC_NRFX_SAADC=n
CONFIG_NRFX_SAADC=n
CONFIG_BT_BAS=n