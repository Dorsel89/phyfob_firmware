CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_NANO=n

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# BMV080 datasheet: the library itself requires ~10 kB of stack and ~17 kB
# of RAM (confirmed dynamically allocated, not static - lib_bmv080.a's own
# .data/.bss sections are all 0 bytes) for whichever thread calls into it.
# We poll it from the main thread, so main's stack must cover that plus our
# own usage on top.
CONFIG_MAIN_STACK_SIZE=10752

# NOTE: no CONFIG_HEAP_MEM_POOL_SIZE needed here. Checked lib_bmv080.a and
# lib_postProcessor.a with nm -u: neither references malloc/calloc/free/
# realloc at all. The datasheet's "~17 kB RAM" figure is the library's
# static .bss (bmv080_ml_device.c.o + postProcessor.c.o + bmv080_rl.c.o
# add up to ~16.3 kB there) - it's not a heap requirement.

#CONFIG_POWEROFF=y
CONFIG_HW_STACK_PROTECTION=y
#low power

CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_PRINTK=n
CONFIG_SERIAL=n


###
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_FLASH=y
CONFIG_SPI=y
#CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
#CONFIG_FLASH_SPI_NOR=y
CONFIG_BOARD_ENABLE_DCDC=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=n


#FOTA#############
# Disabled: BMV080 alone needs ~16 kB static + ~17 kB heap + ~10 kB stack
# (~43 kB of the nRF52832's 64 kB RAM). MCUMGR/img-manager/BT-SMP-transport
# cost ~13 kB of RAM on top of that (net_buf pools, group handlers) - there
# is no room left for BLE-based FOTA while BMV080 is compiled in.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=n
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=n

CONFIG_STREAM_FLASH=y

CONFIG_IMG_MANAGER=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=n

CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
#FOTANEW

# Ensure an MCUboot-compatible binary is generated.
CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_FLASH_MAP=y

CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0

# Allow for larger Bluetooth data packets - mtu="180" as requested by
# BMP581_Pressure.phyphox / Sensor_Server_*.phyphox. debugging.conf overrides
# these back down to 27 for the debug build, which has no RAM headroom left.
CONFIG_BT_L2CAP_TX_MTU=180

CONFIG_BT_L2CAP_TX_BUF_COUNT=2

CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# The negotiated/offered ATT MTU is MIN(BT_L2CAP_RX_MTU, BT_L2CAP_TX_MTU),
# and BT_L2CAP_RX_MTU is derived as BT_BUF_ACL_RX_SIZE - 4 (L2CAP header),
# not the raw ACL size. So this must be 4 bytes larger than the TX MTU above,
# or the stack silently offers only 180-4=176 and the phone reports that the
# requested MTU could not be set.
CONFIG_BT_BUF_ACL_RX_SIZE=184

# TX deliberately stays small: the Host fragments outgoing L2CAP PDUs larger
# than this into several ACL packets on its own (see the Kconfig help of
# BT_BUF_ACL_TX_SIZE), so a large TX MTU does NOT require a large TX buffer.
# Same for the Link Layer PDU size below - a smaller value just means more
# (cheap) over-the-air fragments. Raising either of these to match the MTU
# costs ~1.5 kB of RAM, which does not fit.
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_BUF_ACL_TX_COUNT=2

CONFIG_BT_CTLR_RX_BUFFERS=2

CONFIG_BT_CONN_TX_MAX=2

CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27

# Long/reliable GATT writes (prepare-write) are not used by any of our
# characteristics - the config blobs phyphox writes are <= 20 bytes and fit
# into a single write even at the old 27-byte MTU. Each prepare buffer is
# ATT-MTU sized, so at mtu=180 they were costing several hundred bytes of RAM
# for a capability nothing uses. 0 disables long writes entirely.
CONFIG_BT_ATT_PREPARE_COUNT=0

# Enable the Bluetooth (unauthenticated) and shell mcumgr transports.
CONFIG_BT=y

#CONFIG_ISR_STACK_SIZE=1024
CONFIG_MPSL_WORK_STACK_SIZE=512

CONFIG_BT_LL_SW_SPLIT=n

#CONFIG_BT_LL_SOFTDEVICE=n
# Re-enabled for supercap voltage monitoring (P0.30/AIN6, see src/supercap.c)
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_NRFX_SAADC=y
CONFIG_BT_BAS=n