
#reduce footprint
CONFIG_BOOT_BANNER=y
CONFIG_SIZE_OPTIMIZATIONS=y

#debugging

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2948

CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_LOG_PRINTK=y
# Cut BT-stack INFO noise (bt_hci_core/bt_sdc_hci_driver etc.) at boot - it
# was competing with our own printk() output for the small RTT buffer,
# causing our BMV080 init messages to get silently dropped right at boot.
CONFIG_LOG_DEFAULT_LEVEL=2
#CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y


#CONFIG_POWEROFF=y
CONFIG_HW_STACK_PROTECTION=y

###
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=n

CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n
#FOTANEW

# Ensure an MCUboot-compatible binary is generated.
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=n

# This build has almost no RAM headroom left (debug/RTT overhead on top of
# the same base), so it stays at the original small BLE MTU/buffer sizes
# instead of prj_3v3.conf's mtu=90 (see comment there) - phyphox falls back
# to whatever the fixed sensors' own experiments (not the batched/repeating
# ones) request, or the phyphox-side default MTU.
CONFIG_BT_L2CAP_TX_MTU=27
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27